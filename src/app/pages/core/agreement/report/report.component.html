<p-panel>
  <ng-template pTemplate="header">
    <h1>CONSULTA DE CONVENIOS</h1>
  </ng-template>

  <ng-template pTemplate="content">
    <div class="p-fluid grid">
      <!-- state -->
      <div class="field col-12 xl:col-4 lg:col-4 md:col-6 sm:col-12">
        <label
          appLabel
          for="state"
          label="Estado del convenio"
          [required]="stateFieldControl"></label>

        <p-dropdown
          id="state"
          [formControl]="stateFieldControl"
          dataKey="id"
          [options]="states"
          optionValue="code"
          placeholder="Selecione">
          <ng-template pTemplate="selectedItem" let-selectedItem>
            <div class="flex align-items-center gap-2">
              <div>{{ selectedItem.name }}</div>
            </div>
          </ng-template>
          <ng-template let-item pTemplate="item">
            <div class="flex align-items-center gap-2">
              <div>{{ item.name }}</div>
            </div>
          </ng-template>
        </p-dropdown>

        <small
          appErrorMessage
          [errors]="stateFieldControl.errors"
          [touched]="stateFieldControl.touched"
          [dirty]="stateFieldControl.dirty">
        </small>
      </div>

      <div class="field col-12 xl:col-3 lg:col-3 md:col-3 sm:col-12 mt-5">
        <p-button type="button"
                  [label]="LabelButtonActionEnum.DOWNLOAD"
                  [icon]="IconButtonActionEnum.DOWNLOAD"
                  [severity]="SeverityButtonActionEnum.DOWNLOAD"
                  (click)="downloadReport()"/>
      </div>
    </div>
  </ng-template>
</p-panel>
